<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成果展示 - 影音輪播與瀑布流</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      padding: 24px 20px 80px;
    }

    /* 頂部三部影片輪播區 */
    .carousel-section {
      max-width: 1000px;
      margin: 0 auto 40px;
      position: relative;
    }

    .carousel-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
    }

    .carousel-slide iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .slide-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 24px 18px;
      background: linear-gradient(to top, rgba(11, 15, 25, 0.92) 0%, rgba(11, 15, 25, 0.5) 60%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    .slide-caption .slide-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .slide-caption .slide-subtitle {
      font-size: 0.85rem;
      color: var(--accent);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* 直排動態文字按鈕 */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      padding: 12px 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #fff;
      cursor: pointer;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .carousel-arrow .btn-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 0.82rem;
      letter-spacing: 2px;
      font-weight: 500;
      line-height: 1.1;
    }

    .carousel-arrow .arrow-icon {
      font-size: 0.8rem;
      line-height: 1;
    }

    .carousel-arrow:hover {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
    }

    .carousel-arrow.prev { left: -46px; }
    .carousel-arrow.next { right: -46px; }

    @media (max-width: 900px) {
      .carousel-arrow {
        width: 32px;
        padding: 8px 4px;
      }
      .carousel-arrow .btn-text {
        font-size: 0.75rem;
      }
      .carousel-arrow.prev { left: 8px; }
      .carousel-arrow.next { right: 8px; }
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: all 0.25s;
    }

    .dot.active {
      background: var(--accent);
      width: 28px;
      border-radius: 8px;
    }

    /* 篩選按鈕列 */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      border-color: var(--accent);
    }

/* 1. 將瀑布流改為整齊的 CSS Grid 4 欄宮格 */
.masonry-gallery {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

@media (max-width: 1200px) {
  .masonry-gallery { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 800px) {
  .masonry-gallery { grid-template-columns: repeat(2, 1fr); gap: 14px; }
}
@media (max-width: 500px) {
  .masonry-gallery { grid-template-columns: 1fr; }
}

/* 2. 卡片強制固定為 1:1 正方形 */
.item-card {
  aspect-ratio: 1 / 1; /* 關鍵：強制變為正方形 */
  position: relative;
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.item-card:hover {
  transform: translateY(-4px);
}

/* 3. 圖片填滿正方形（置中裁切，不變形） */
.item-card img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* 若不想裁切任何邊緣，可改為 contain */
  display: block;
  transition: transform 0.4s ease;
}

    .item-card:hover img {
      transform: scale(1.03);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
    }

    .item-card:hover .play-overlay {
      background: rgba(0, 0, 0, 0.4);
    }

    .play-btn-circle {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s;
    }

    .item-card:hover .play-btn-circle {
      transform: scale(1.1);
    }

    .play-btn-circle svg {
      width: 22px;
      height: 22px;
      fill: #0b0f19;
      margin-left: 3px;
    }

    .type-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #fff;
      pointer-events: none;
    }

    /* 燈箱彈窗 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.94);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content-wrapper {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content-wrapper img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      object-fit: contain;
    }

    .modal-content-wrapper iframe {
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: none;
    }

    .video-landscape {
      width: 85vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      height: auto;
    }

    .video-portrait {
      height: 85vh;
      aspect-ratio: 9 / 16;
      max-width: 90vw;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      cursor: pointer;
      width: 44px;
      height: 44px;
      line-height: 44px;
      text-align: center;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- 1. 頂部三部影片輪播區塊 (包含按鈕動態文字定義) -->
  <section class="carousel-section">
    <button class="carousel-arrow prev" id="prevSlide" aria-label="上一部">
      <span class="arrow-icon">&#9664;</span>
      <span class="btn-text">上一部</span>
    </button>
    <button class="carousel-arrow next" id="nextSlide" aria-label="下一部">
      <span class="btn-text">下一部</span>
      <span class="arrow-icon">&#9654;</span>
    </button>

    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        
        <!-- 第 1 部影片：切換前是第 3 部(成果型)，切換後是第 2 部(訪談型) -->
        <div class="carousel-slide" data-btn-prev="成果型" data-btn-next="訪談型">
          <iframe width="560" height="315" src="https://www.youtube.com/embed/m4Jch4vEA8s?si=wCltKznaf2y9LwTD" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <div class="slide-caption">
            <div class="slide-title">嘉義現代文學選讀：數位敘事的新視界</div>
            <div class="slide-subtitle">宣導型 ｜ 大學國文Ⅱ</div>
          </div>
        </div>

        <!-- 第 2 部影片：切換前是第 1 部(宣導型)，切換後是第 2 部(成果型) -->
        <div class="carousel-slide" data-btn-prev="宣導型" data-btn-next="成果型">
          <iframe width="560" height="315" src="https://www.youtube.com/embed/HQJfy8Ioqis?si=95ylvb6Z39yEQXcw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <div class="slide-caption">
            <div class="slide-title">當經典文本遇上數位AI：現代文學的在地融合與教學創新</div>
            <div class="slide-subtitle">訪談型 ｜ 大學國文Ⅱ</div>
          </div>
        </div>

        <!-- 第 3 部影片：切換前是第 2 部(訪談型)，切換後是第 1 部(宣導型) -->
        <div class="carousel-slide" data-btn-prev="訪談型" data-btn-next="宣導型">
          <iframe width="560" height="315" src="https://www.youtube.com/embed/psbpy-ELMM0?si=bstw8dCS2s6ADeNZ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <div class="slide-caption">
            <div class="slide-title">從文字到影像：嘉義現代文學學生跨域創作成果</div>
            <div class="slide-subtitle">成果型 ｜ 大學國文Ⅱ</div>
          </div>
        </div>

      </div>
    </div>

    <!-- 底部圓點 -->
    <div class="carousel-dots">
      <div class="dot active" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
    </div>
  </section>

  <!-- 2. 分類篩選列 -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">全部成果</button>
    <button class="filter-btn" data-filter="image">小吃地圖</button>
    <button class="filter-btn" data-filter="video-portrait">多媒體短片</button>
    <button class="filter-btn" data-filter="class-record">課程紀錄</button>
  </div>

<!-- 3. 瀑布流展覽區 -->
  <div class="masonry-gallery">

    <div class="item-card" data-type="video-portrait" data-orient="portrait" data-yt="T-PemC8Qcv8">
      <span class="type-tag">Shorts</span>
      <img src="https://img.youtube.com/vi/T-PemC8Qcv8/hqdefault.jpg" alt="多媒體短片">
      <div class="play-overlay">
        <div class="play-btn-circle"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
      </div>
    </div>

    <div class="item-card" data-type="image" data-src="https://github.com/discoverchiayi/discoveringchiayi/blob/main/%E5%AD%B8%E7%94%9F%E4%BD%9C%E5%93%81/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87(II)%20%EF%BC%9A%E5%98%89%E7%BE%A9%E7%8F%BE%E4%BB%A3%E6%96%87%E5%AD%B8%E9%81%B8%E8%AE%80/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87-%E5%9C%B0%E5%9C%96/%E6%9C%88%E5%BA%95%E6%95%91%E6%98%9F%E6%8A%B5%E5%98%89.jpg?raw=true">
      <img src="https://github.com/discoverchiayi/discoveringchiayi/blob/main/%E5%AD%B8%E7%94%9F%E4%BD%9C%E5%93%81/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87(II)%20%EF%BC%9A%E5%98%89%E7%BE%A9%E7%8F%BE%E4%BB%A3%E6%96%87%E5%AD%B8%E9%81%B8%E8%AE%80/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87-%E5%9C%B0%E5%9C%96/%E6%9C%88%E5%BA%95%E6%95%91%E6%98%9F%E6%8A%B5%E5%98%89.jpg?raw=true" alt="小吃地圖">
    </div>

    <div class="item-card" data-type="class-record" data-src="https://github.com/discoverchiayi/discoveringchiayi/blob/main/%E8%A8%88%E7%95%AB%E8%A8%98%E9%8C%84/%E8%AA%B2%E7%A8%8B%E7%B4%80%E9%8C%84/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87(II)%20%EF%BC%9A%E5%98%89%E7%BE%A9%E7%8F%BE%E4%BB%A3%E6%96%87%E5%AD%B8%E9%81%B8%E8%AE%80/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87_%E8%AA%B2%E7%A8%8B%E7%B4%80%E9%8C%84%20(1).jpg?raw=true">
      <img src="https://github.com/discoverchiayi/discoveringchiayi/blob/main/%E8%A8%88%E7%95%AB%E8%A8%98%E9%8C%84/%E8%AA%B2%E7%A8%8B%E7%B4%80%E9%8C%84/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87(II)%20%EF%BC%9A%E5%98%89%E7%BE%A9%E7%8F%BE%E4%BB%A3%E6%96%87%E5%AD%B8%E9%81%B8%E8%AE%80/%E5%A4%A7%E5%AD%B8%E5%9C%8B%E6%96%87_%E8%AA%B2%E7%A8%8B%E7%B4%80%E9%8C%84%20(1).jpg?raw=true" alt="課程紀錄">
    </div>

  </div>

  <!-- 4. 燈箱彈窗 -->
  <div class="modal" id="lightboxModal">
    <button class="close-btn" id="closeModal">&times;</button>
    <div class="modal-content-wrapper" id="modalContainer"></div>
  </div>

  <script>
    // ================= A. 輪播切換與動態按鈕文字 =================
    const track = document.getElementById('carouselTrack');
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.carousel-dots .dot');
    const prevBtn = document.getElementById('prevSlide');
    const nextBtn = document.getElementById('nextSlide');
    const prevTextEl = prevBtn.querySelector('.btn-text');
    const nextTextEl = nextBtn.querySelector('.btn-text');

    let currentIndex = 0;
    const totalSlides = slides.length;

    function pauseAllCarouselVideos() {
      const iframes = track.querySelectorAll('iframe');
      iframes.forEach(iframe => {
        iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
      });
    }

    function goToSlide(index) {
      pauseAllCarouselVideos();
      currentIndex = (index + totalSlides) % totalSlides;
      track.style.transform = `translateX(-${currentIndex * 100}%)`;

      // 更新圓點樣式
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });

      // 根據當前投影片，更換左右按鈕的文字
      const currentSlide = slides[currentIndex];
      if (currentSlide) {
        prevTextEl.textContent = currentSlide.dataset.btnPrev || '上一部';
        nextTextEl.textContent = currentSlide.dataset.btnNext || '下一部';
      }
    }

    prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));
    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        goToSlide(parseInt(dot.dataset.index));
      });
    });

    // 初始化按鈕字樣
    goToSlide(0);

    // ================= B. 分類篩選與 Hash 讀取邏輯 =================
    const filterButtons = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.item-card');

    function applyFilter(category) {
      filterButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === category);
      });

      cards.forEach(card => {
        if (category === 'all' || card.dataset.type === category) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        applyFilter(filter);
        history.replaceState(null, null, `#${filter}`);
      });
    });

    // 網頁一載入立刻檢查網址後方是否有 #image 等標籤並自動篩選
	function initFilterFromHash() {
  		const hash = window.location.hash.substring(1);
  		const validFilters = Array.from(filterButtons).map(b => b.dataset.filter);
  		if (hash && validFilters.includes(hash)) {
    		applyFilter(hash);
  		} else {
    		applyFilter('all');
  		}
		}
	initFilterFromHash();
	window.addEventListener('hashchange', initFilterFromHash);
		});

    // ================= C. 燈箱彈窗邏輯 =================
    const modal = document.getElementById('lightboxModal');
    const modalContainer = document.getElementById('modalContainer');
    const closeModal = document.getElementById('closeModal');

    function openModal(card) {
      modalContainer.innerHTML = '';
      const type = card.dataset.type;

      if (type === 'image') {
        const img = document.createElement('img');
        img.src = card.dataset.src;
        modalContainer.appendChild(img);
      } else {
        const ytId = card.dataset.yt;
        const orient = card.dataset.orient;

        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;
        iframe.className = orient === 'portrait' ? 'video-portrait' : 'video-landscape';

        modalContainer.appendChild(iframe);
      }
      modal.classList.add('active');
    }

    function hideModal() {
      modal.classList.remove('active');
      modalContainer.innerHTML = '';
    }

    cards.forEach(card => {
      card.addEventListener('click', () => openModal(card));
    });

    closeModal.addEventListener('click', hideModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) hideModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideModal();
    });
  </script>
</body>
</html>
