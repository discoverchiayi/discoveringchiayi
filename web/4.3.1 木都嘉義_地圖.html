    // ===== 2. 地圖狀態與初始化 (預設採用免金鑰穩定引擎，避免 ApiProjectMapError) =====
    let leafletMap = null;
    let leafletMarkers = {};
    let leafletLayers = {};
    let isGoogleMapMode = false;
    let googleMapInstance = null;
    let googleMarkers = {};
    let googleInfoWindow = null;

    let activeFilter = 'all';
    let searchQuery = '';
    const CHIAYI_CENTER = [23.483, 120.458];

    function initMapEngine() {
      const savedKey = localStorage.getItem('CHIAYI_GOOGLE_MAPS_KEY');
      if (savedKey) {
        document.getElementById('googleApiKeyInput').value = savedKey;
        document.getElementById('apiKeyStatusText').textContent = "已套用金鑰";
        loadGoogleMapsScript(savedKey);
      } else {
        initLeafletMap();
      }
    }

    // 初始化 Leaflet 地圖 (免金鑰、穩定不崩潰)
    function initLeafletMap() {
      document.getElementById('map').classList.remove('hidden');
      document.getElementById('googleMap').classList.add('hidden');
      isGoogleMapMode = false;

      if (leafletMap) return;

      leafletMap = L.map('map', {
        center: CHIAYI_CENTER,
        zoom: 14,
        zoomControl: false
      });

      // 各式免金鑰圖層
      leafletLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri, Maxar, Earthstar Geographics'
      }).addTo(leafletMap);

      leafletLayers.topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenTopoMap contributors'
      });

      // 建立標記點
      PLACES.forEach(place => {
        const pinHtml = `
          <div class="custom-map-pin flex items-center justify-center w-8 h-8 rounded-full shadow-lg border-2 border-white cursor-pointer" style="background-color: ${place.pinColor};">
            <i class="fa-solid fa-tree text-white text-xs"></i>
          </div>
        `;
        const customIcon = L.divIcon({
          html: pinHtml,
          className: '',
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -32]
        });

        const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(leafletMap);
        marker.bindPopup(createPopupContent(place), { maxWidth: 320 });
        
        marker.on('click', () => {
          highlightCard(place.id);
        });

        leafletMarkers[place.id] = marker;
      });

      renderPlaceList();
    }

    // 動態載入 Google Maps JavaScript API (若使用者自行填入金鑰)
    function loadGoogleMapsScript(key) {
      if (window.google && window.google.maps) {
        initNativeGoogleMap();
        return;
      }
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly`;
      script.async = true;
      script.onload = () => {
        initNativeGoogleMap();
      };
      script.onerror = () => {
        console.warn("Google Maps API 載入失敗，將回退至安全地圖模式。");
        localStorage.removeItem('CHIAYI_GOOGLE_MAPS_KEY');
        document.getElementById('apiKeyStatusText').textContent = "自訂金鑰";
        initLeafletMap();
      };
      document.head.appendChild(script);
    }

    function initNativeGoogleMap() {
      try {
        document.getElementById('map').classList.add('hidden');
        document.getElementById('googleMap').classList.remove('hidden');
        isGoogleMapMode = true;

        googleMapInstance = new google.maps.Map(document.getElementById("googleMap"), {
          center: { lat: CHIAYI_CENTER[0], lng: CHIAYI_CENTER[1] },
          zoom: 14,
          mapTypeId: google.maps.MapTypeId.HYBRID,
          disableDefaultUI: true,
          zoomControl: false
        });

        googleInfoWindow = new google.maps.InfoWindow();

        PLACES.forEach(place => {
          const markerSvg = {
            path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z",
            fillColor: place.pinColor,
            fillOpacity: 1.0,
            strokeWeight: 2,
            strokeColor: "#ffffff",
            scale: 1.5,
            anchor: new google.maps.Point(12, 22),
          };

          const marker = new google.maps.Marker({
            position: { lat: place.lat, lng: place.lng },
            map: googleMapInstance,
            title: place.name,
            icon: markerSvg
          });

          marker.addListener("click", () => {
            googleInfoWindow.setContent(createPopupContent(place));
            googleInfoWindow.open(googleMapInstance, marker);
            highlightCard(place.id);
          });

          googleMarkers[place.id] = marker;
        });

        renderPlaceList();
      } catch (err) {
        console.error("Google Maps 初始化異常，自動切換至相容地圖模式：", err);
        initLeafletMap();
      }
    }

    // 切換地圖圖層
    function changeMapLayer(layerKey) {
      if (isGoogleMapMode && googleMapInstance) {
        if (layerKey === "topo") {
          googleMapInstance.setMapTypeId(google.maps.MapTypeId.TERRAIN);
        } else {
          googleMapInstance.setMapTypeId(google.maps.MapTypeId.HYBRID);
        }
        return;
      }

      if (!leafletMap) return;
      Object.values(leafletLayers).forEach(layer => leafletMap.removeLayer(layer));
      if (leafletLayers[layerKey]) {
        leafletLayers[layerKey].addTo(leafletMap);
      } else {
        leafletLayers.satellite.addTo(leafletMap);
      }
    }

    // 生成彈窗內容 (提供一鍵開啟 Google 導航與 360° 實景街景，支援 YouTube 影音嵌入)

            <span class="text-[11px] text-wood-500 font-medium">${p.group}</span>
          </div>
          <h3 class="text-base font-bold font-serif text-wood-900 leading-snug mb-1">${p.name}</h3>

          ${videoSection}

          <div class="space-y-1 text-xs text-wood-800 bg-wood-100/80 p-2.5 rounded-xl border border-wood-200/70 mb-2.5">
            <div class="flex items-start gap-1.5">
              <i class="fa-solid fa-location-dot text-wood-500 mt-0.5 text-xs"></i>
              <span>${p.address}</span>
            </div>
            ${p.phone ? `
            <div class="flex items-center gap-1.5">

            <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lng}" target="_blank" rel="noopener noreferrer"

              <i class="fa-solid fa-street-view text-wood-600"></i> 實景街景

    // ===== 3. 側邊欄渲染與過濾邏輯 =====
    function renderPlaceList() {
      const container = document.getElementById('placeList');
      container.innerHTML = '';

      const filtered = PLACES.filter(p => {
        const matchCategory = (activeFilter === 'all') || (p.category === activeFilter);
        const query = searchQuery.trim().toLowerCase();
        const matchSearch = !query || 
          p.name.toLowerCase().includes(query) ||
          p.address.toLowerCase().includes(query) ||
          p.desc.toLowerCase().includes(query) ||
          p.business.toLowerCase().includes(query) ||
          p.group.toLowerCase().includes(query);

        return matchCategory && matchSearch;
      });

      document.getElementById('visibleCount').textContent = filtered.length;

      // 更新地圖標記顯示/隱藏
      PLACES.forEach(p => {
        const isVisible = filtered.some(f => f.id === p.id);
        if (isGoogleMapMode && googleMarkers[p.id]) {
          googleMarkers[p.id].setVisible(isVisible);
        } else if (leafletMarkers[p.id] && leafletMap) {
          if (isVisible) {
            if (!leafletMap.hasLayer(leafletMarkers[p.id])) {
              leafletMarkers[p.id].addTo(leafletMap);
            }
          } else {
            if (leafletMap.hasLayer(leafletMarkers[p.id])) {
              leafletMap.removeLayer(leafletMarkers[p.id]);
            }
          }
        }
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-wood-400">
            <i class="fa-regular fa-face-frown text-3xl mb-2"></i>
            <p class="text-xs">找不到符合條件的木業據點</p>
          </div>
        `;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.id = `card-${p.id}`;
        card.className = "place-card bg-white hover:bg-wood-50/90 p-3.5 rounded-2xl border border-wood-200/90 shadow-sm cursor-pointer transition-all duration-200 hover:shadow-md hover:border-wood-400";
        
        const videoBadge = p.youtubeId ? `
          <span class="inline-flex items-center gap-1 text-[10px] font-bold bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full border border-red-200">
            <i class="fa-brands fa-youtube text-red-600"></i> 影音導覽
          </span>
        ` : '';

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[10px] font-semibold text-white px-2 py-0.5 rounded-full ${p.badgeColor}">${p.catName}</span>
              ${videoBadge}
            </div>
            <span class="text-[10px] text-wood-500 font-mono">${p.group.split(' ')[0]}</span>
          </div>
          <h4 class="text-sm font-bold text-wood-900 font-serif mb-1 group-hover:text-wood-600">${p.name}</h4>
          <p class="text-[11px] text-wood-600 line-clamp-1 mb-2 font-medium">${p.tagline}</p>
          
          <div class="text-[11px] text-wood-500 space-y-0.5">
            <div class="truncate"><i class="fa-solid fa-location-dot w-3.5 text-wood-400"></i> ${p.address}</div>
            ${p.phone ? `<div class="truncate"><i class="fa-solid fa-phone w-3.5 text-wood-400"></i> ${p.phone}</div>` : ''}
          </div>
        `;

        card.addEventListener('click', () => {
          focusPlace(p.id);
          if (window.innerWidth < 1024) {
            closeSidebarOnMobile();
          }
        });

        container.appendChild(card);
      });
    }

    // 聚焦特定景點
    function focusPlace(id) {
      const p = PLACES.find(item => item.id === id);
      if (!p) return;

      if (isGoogleMapMode && googleMapInstance) {
        const marker = googleMarkers[id];
        if (marker) {
          googleMapInstance.panTo({ lat: p.lat, lng: p.lng });
          googleMapInstance.setZoom(16);
          googleInfoWindow.setContent(createPopupContent(p));
          googleInfoWindow.open(googleMapInstance, marker);
        }
      } else if (leafletMap) {
        const marker = leafletMarkers[id];
        if (marker) {
          leafletMap.setView([p.lat, p.lng], 16, { animate: true });
          marker.openPopup();
        }
      }
      highlightCard(id);
    }

    function highlightCard(id) {
      document.querySelectorAll('.place-card').forEach(c => {
        c.classList.remove('ring-2', 'ring-wood-600', 'bg-wood-100');
      });
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('ring-2', 'ring-wood-600', 'bg-wood-100');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // 重置全視角
    function resetMapView() {
      if (isGoogleMapMode && googleMapInstance) {
        const bounds = new google.maps.LatLngBounds();
        let count = 0;
        Object.values(googleMarkers).forEach(m => {
          if (m.getVisible()) {
            bounds.extend(m.getPosition());
            count++;
          }
        });
        if (count > 0) googleMapInstance.fitBounds(bounds);
        else {
          googleMapInstance.panTo({ lat: CHIAYI_CENTER[0], lng: CHIAYI_CENTER[1] });
          googleMapInstance.setZoom(14);
        }
      } else if (leafletMap) {
        const visibleMarkers = Object.values(leafletMarkers).filter(m => leafletMap.hasLayer(m));
        if (visibleMarkers.length > 0) {
          const group = L.featureGroup(visibleMarkers);
          leafletMap.fitBounds(group.getBounds().pad(0.1));
        } else {
          leafletMap.setView(CHIAYI_CENTER, 14);
        }
      }
    }

    function zoomInMap() {
      if (isGoogleMapMode && googleMapInstance) googleMapInstance.setZoom(googleMapInstance.getZoom() + 1);
      else if (leafletMap) leafletMap.zoomIn();
    }

    function zoomOutMap() {
      if (isGoogleMapMode && googleMapInstance) googleMapInstance.setZoom(googleMapInstance.getZoom() - 1);
      else if (leafletMap) leafletMap.zoomOut();
    }

    // 側邊欄控制
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');

    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
    });

    function closeSidebarOnMobile() {
      if (window.innerWidth < 1024) {
        sidebar.classList.add('-translate-x-full');
      }
    }

    // 分類篩選按鈕
    document.querySelectorAll('.cat-filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.cat-filter-btn').forEach(b => {
          b.className = "cat-filter-btn px-2.5 py-1 rounded-full bg-white text-wood-700 hover:bg-wood-200 border border-wood-200 transition";
        });
        const target = e.currentTarget;
        target.className = "cat-filter-btn px-2.5 py-1 rounded-full bg-wood-800 text-amber-100 font-medium transition shadow-sm";
        activeFilter = target.getAttribute('data-cat');
        renderPlaceList();
      });
    });

    // 搜尋功能
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchQuery.length > 0) {
        clearSearch.classList.remove('hidden');
      } else {
        clearSearch.classList.add('hidden');
      }
      renderPlaceList();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearch.classList.add('hidden');
      renderPlaceList();
    });

    // API Key 彈窗處理
    function openApiKeyModal() {
      document.getElementById('apiKeyModal').classList.remove('hidden');
    }
    function closeApiKeyModal() {
      document.getElementById('apiKeyModal').classList.add('hidden');
    }
    function saveApiKey() {
      const key = document.getElementById('googleApiKeyInput').value.trim();
      if (key) {
        localStorage.setItem('CHIAYI_GOOGLE_MAPS_KEY', key);
        document.getElementById('apiKeyStatusText').textContent = "已套用金鑰";
        closeApiKeyModal();
        loadGoogleMapsScript(key);
      }
    }
    function clearApiKey() {
      localStorage.removeItem('CHIAYI_GOOGLE_MAPS_KEY');
      document.getElementById('googleApiKeyInput').value = '';
      document.getElementById('apiKeyStatusText').textContent = "自訂金鑰";
      closeApiKeyModal();
      initLeafletMap();
    }

    // 頁面載入初始化
    window.addEventListener('DOMContentLoaded', () => {
      initMapEngine();
    });
  </script>
</body>
</html>
